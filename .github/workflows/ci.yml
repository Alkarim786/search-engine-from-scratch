name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Unit + integration tests (race detector on)
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: search-engine-from-scratch:ci
      - name: End-to-end smoke test (crawl a local site, index it, search it)
        run: |
          python3 -m http.server 8000 --directory testdata/site >/dev/null 2>&1 &
          sleep 1
          docker volume create idx
          docker run --rm --network host -v idx:/data --user root --entrypoint sh search-engine-from-scratch:ci \
            -c 'crawler -seeds http://localhost:8000/ -max-pages 20 -delay 10ms && indexer'
          docker run -d --name se --network host -v idx:/data -e ADDR=:8081 search-engine-from-scratch:ci
          for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
          curl -sf 'localhost:8081/search?q=zebra+stripes' | tee out.json
          python3 - <<'PY'
          import json
          r = json.load(open("out.json"))
          urls = [x["url"] for x in r["results"]]
          assert r["total"] >= 2, r
          assert urls[0].endswith("/zebra.html"), urls
          assert not any("secret" in u for u in urls), "robots.txt violated"
          print("ok", urls)
          PY
          curl -sf 'localhost:8081/suggest?q=zeb'
          docker rm -f se
